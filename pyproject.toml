[project]
name = "spoti-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kszabat", email = "krystian.szabat@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-ai>=2.37.0",
    "pydantic-ai-harness>=0.28.0",
    "pydantic-ai-slim[duckduckgo]>=2.37.0",
    "pydantic-settings>=2.15.0",
    "spotipy>=2.26.0",
    "typer>=0.27.2",
]

[project.scripts]
spoti-agent = "spoti_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.5",
]
